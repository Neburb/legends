name: Build and publish private-source release

on:
  repository_dispatch:
    types: [publish-legends]

permissions:
  contents: write

concurrency:
  group: publish-legends
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ github.event.client_payload.source_sha }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out public release repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate dispatch payload
        env:
          SOURCE_SHA: ${{ github.event.client_payload.source_sha }}
          SOURCE_REPO: ${{ github.event.client_payload.source_repo }}
        run: |
          set -euo pipefail
          test "$SOURCE_REPO" = "Neburb/gen1recomp-legends"
          printf '%s\n' "$SOURCE_SHA" | grep -Eq '^[0-9a-f]{40}$'

      - name: Check out private source commit
        uses: actions/checkout@v4
        with:
          repository: Neburb/gen1recomp-legends
          ref: ${{ github.event.client_payload.source_sha }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Determine public release version
        id: version
        env:
          SOURCE_SHA: ${{ github.event.client_payload.source_sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import re
          import subprocess

          semver = re.compile(r"^v(\d+)\.(\d+)\.(\d+)$")
          tags = subprocess.run(
              ["git", "tag", "-l", "v*"], capture_output=True, text=True,
              check=True).stdout.splitlines()
          released = sorted(
              tuple(map(int, match.groups()))
              for tag in tags
              if (match := semver.match(tag))
          )
          manifest = json.loads(open("source/manifest.json", encoding="utf-8").read())
          candidate = tuple(map(int, str(manifest["version"]).split(".")))
          latest = released[-1] if released else None
          if latest is None:
              major, minor, patch = candidate
              version = (major, minor, patch + 1)
          elif candidate > latest:
              version = candidate
          else:
              major, minor, patch = latest
              version = (major, minor, patch + 1)
          if version[2] > 99:
              version = (version[0], version[1] + 1, 0)
          text = "%d.%d.%d" % version
          print(f"version={text}")
          print(f"tag=v{text}")
          print(f"source_sha={os.environ['SOURCE_SHA']}")
          PY

      - name: Build installable public ZIP
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SOURCE_SHA: ${{ steps.version.outputs.source_sha }}
        run: |
          set -euo pipefail
          staging="$RUNNER_TEMP/legends-package"
          mkdir -p "$staging" dist
          git -C source archive "$SOURCE_SHA" | tar -x -C "$staging"
          rm -rf "$staging/.github" "$staging/.git" "$staging/.gitattributes" \
            "$staging/.gitignore" "$staging/.luarc.json"
          python3 - "$staging/manifest.json" "$staging/main.lua" "$VERSION" <<'PY'
          import json
          import re
          import sys
          manifest_path, main_path, version = sys.argv[1:]
          with open(manifest_path, encoding="utf-8") as fh:
              manifest = json.load(fh)
          manifest["version"] = version
          manifest["github"] = "Neburb/legends"
          with open(manifest_path, "w", encoding="utf-8") as fh:
              json.dump(manifest, fh, indent=2, ensure_ascii=False)
              fh.write("\n")
          source = open(main_path, encoding="utf-8").read()
          stamped, count = re.subn(
              r'(mod\.exports\.version\s*=\s*")[^"]+(\")',
              rf'\g<1>{version}\g<2>', source, count=1)
          if count != 1:
              raise SystemExit("main.lua mod version declaration not found")
          open(main_path, "w", encoding="utf-8").write(stamped)
          PY
          (cd "$staging" && python3 tools/package.py --out "$GITHUB_WORKSPACE/dist")
          generated="dist/stadium_realtime_combat_${VERSION}.zip"
          test -s "$generated"
          mv "$generated" "dist/stadium_realtime_combat-${VERSION}.zip"
          (cd dist && sha256sum "stadium_realtime_combat-${VERSION}.zip" > SHA256SUMS.txt)

      - name: Check freshness and duplicate source at publication boundary
        id: boundary
        uses: actions/github-script@v7
        env:
          SOURCE_SHA: ${{ steps.version.outputs.source_sha }}
          SOURCE_REF: ${{ github.event.client_payload.source_ref }}
          PUBLIC_TOKEN: ${{ github.token }}
        with:
          github-token: ${{ secrets.SOURCE_REPO_TOKEN }}
          script: |
            const sha = process.env.SOURCE_SHA;
            if (!/^[0-9a-f]{40}$/.test(sha)) throw new Error('Invalid source SHA');
            if (process.env.SOURCE_REF !== 'refs/heads/main') throw new Error('Invalid source ref');
            // Public releases identify the immutable source snapshot in their existing notes.
            const sourceUrl = `https://github.com/Neburb/gen1recomp-legends/commit/${sha}`;
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: 'Neburb', repo: 'legends', per_page: 100,
              headers: {authorization: `Bearer ${process.env.PUBLIC_TOKEN}`},
            });
            const matches = releases.filter(r => (r.body || '').replace(/\\n/g, '\n').split(/\r?\n/).includes(`Source: ${sourceUrl}`));
            const repair = r => new Error(`Source release needs recovery: ${r.html_url}; follow docs/release-recovery.md using this exact source SHA and existing tag.`);
            // A failed upload can leave a draft/tag. Never allocate another version for it.
            const draft = matches.find(r => r.draft);
            if (draft) throw repair(draft);
            if (matches.length > 1) throw repair(matches[0]);
            const prior = matches[0];
            if (prior) {
              if (!/^v\d+\.\d+\.\d+$/.test(prior.tag_name)) throw repair(prior);
              const zipName = `stadium_realtime_combat-${prior.tag_name.slice(1)}.zip`;
              const named = name => prior.assets.filter(a => a.name === name);
              if (named(zipName).length !== 1 || named('SHA256SUMS.txt').length !== 1) throw repair(prior);
              const zip = named(zipName)[0], sums = named('SHA256SUMS.txt')[0];
              if (!(zip.size > 0 && sums.size > 0)) throw repair(prior);
              const download = async asset => {
                const {data} = await github.rest.repos.getReleaseAsset({
                  owner: 'Neburb', repo: 'legends', asset_id: asset.id,
                  headers: {authorization: `Bearer ${process.env.PUBLIC_TOKEN}`, accept: 'application/octet-stream'},
                });
                const bytes = Buffer.from(data);
                if (bytes.length !== asset.size) throw repair(prior);
                return bytes;
              };
              const checksum = (await download(sums)).toString('utf8').trim();
              const expected = checksum.match(/^([0-9a-f]{64}) [ *]([^\r\n]+)$/);
              if (!expected || expected[2] !== zipName) throw repair(prior);
              const digest = require('node:crypto').createHash('sha256').update(await download(zip)).digest('hex');
              if (digest !== expected[1]) throw repair(prior);
              core.info(`Already published ${sha}: ${prior.html_url}`);
              core.setOutput('allowed', 'false');
              return;
            }
            // Check last, at the receiver boundary, including manual/retried dispatches.
            const {data: branch} = await github.rest.repos.getBranch({
              owner: 'Neburb', repo: 'gen1recomp-legends', branch: 'main',
            });
            if (branch.commit.sha !== sha) {
              core.info(`Skip superseded source ${sha}; main is ${branch.commit.sha}`);
              core.setOutput('allowed', 'false');
              return;
            }
            core.setOutput('allowed', 'true');

      - name: Publish GitHub Release
        if: steps.boundary.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          SOURCE_SHA: ${{ steps.version.outputs.source_sha }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --target main \
            --title "Legends $VERSION" \
            --notes "Automated package for private source commit $SOURCE_SHA.\n\nSource: https://github.com/Neburb/gen1recomp-legends/commit/$SOURCE_SHA" \
            "dist/stadium_realtime_combat-${VERSION}.zip" \
            dist/SHA256SUMS.txt

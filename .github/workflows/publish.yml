name: Build and publish private-source release

on:
  repository_dispatch:
    types: [publish-legends]

permissions:
  contents: write

concurrency:
  group: publish-legends
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ github.event.client_payload.source_sha }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out public release repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate dispatch payload
        env:
          SOURCE_SHA: ${{ github.event.client_payload.source_sha }}
          SOURCE_REPO: ${{ github.event.client_payload.source_repo }}
          SOURCE_REF: ${{ github.event.client_payload.source_ref }}
        run: |
          set -euo pipefail
          test "$SOURCE_REF" = "refs/heads/main"
          test "$SOURCE_REPO" = "Neburb/gen1recomp-legends"
          printf '%s\n' "$SOURCE_SHA" | grep -Eq '^[0-9a-f]{40}$'

      - name: Verify current private main before executing source
        id: source
        uses: actions/github-script@v7
        env:
          SOURCE_SHA: ${{ github.event.client_payload.source_sha }}
        with:
          github-token: ${{ secrets.SOURCE_REPO_TOKEN }}
          script: |
            const {data: branch} = await github.rest.repos.getBranch({
              owner: 'Neburb', repo: 'gen1recomp-legends', branch: 'main',
            });
            core.setOutput('allowed', branch.commit.sha === process.env.SOURCE_SHA ? 'true' : 'false');
            if (branch.commit.sha !== process.env.SOURCE_SHA) core.info('Skip superseded source before build');

      - name: Prepare trusted isolated packaging runtime
        if: steps.source.outputs.allowed == 'true'
        run: docker build -t legends-release-builder -f scripts/release-container.Dockerfile scripts

      - name: Check out private source commit
        if: steps.source.outputs.allowed == 'true'
        uses: actions/checkout@v4
        with:
          repository: Neburb/gen1recomp-legends
          ref: ${{ github.event.client_payload.source_sha }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Determine public release version
        if: steps.source.outputs.allowed == 'true'
        id: version
        env:
          SOURCE_SHA: ${{ github.event.client_payload.source_sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import re
          import subprocess

          semver = re.compile(r"^v(\d+)\.(\d+)\.(\d+)$")
          tags = subprocess.run(
              ["git", "tag", "-l", "v*"], capture_output=True, text=True,
              check=True).stdout.splitlines()
          released = sorted(
              tuple(map(int, match.groups()))
              for tag in tags
              if (match := semver.match(tag))
          )
          manifest = json.loads(open("source/manifest.json", encoding="utf-8").read())
          candidate = tuple(map(int, str(manifest["version"]).split(".")))
          latest = released[-1] if released else None
          if latest is None:
              major, minor, patch = candidate
              version = (major, minor, patch + 1)
          elif candidate > latest:
              version = candidate
          else:
              major, minor, patch = latest
              version = (major, minor, patch + 1)
          if version[2] > 99:
              version = (version[0], version[1] + 1, 0)
          text = "%d.%d.%d" % version
          print(f"version={text}")
          print(f"tag=v{text}")
          print(f"source_sha={os.environ['SOURCE_SHA']}")
          PY

      - name: Build installable public ZIP
        if: steps.source.outputs.allowed == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SOURCE_SHA: ${{ steps.version.outputs.source_sha }}
        run: |
          set -euo pipefail
          python3 scripts/isolated_release.py --source source \
            --source-sha "$SOURCE_SHA" --version "$VERSION" --out dist

      - name: Check freshness and duplicate source at publication boundary
        if: steps.source.outputs.allowed == 'true'
        id: boundary
        uses: actions/github-script@v7
        env:
          SOURCE_SHA: ${{ steps.version.outputs.source_sha }}
          SOURCE_REF: ${{ github.event.client_payload.source_ref }}
          PUBLIC_TOKEN: ${{ github.token }}
        with:
          github-token: ${{ secrets.SOURCE_REPO_TOKEN }}
          script: |
            const sha = process.env.SOURCE_SHA;
            if (!/^[0-9a-f]{40}$/.test(sha)) throw new Error('Invalid source SHA');
            if (process.env.SOURCE_REF !== 'refs/heads/main') throw new Error('Invalid source ref');
            // Public releases identify the immutable source snapshot in their existing notes.
            const sourceUrl = `https://github.com/Neburb/gen1recomp-legends/commit/${sha}`;
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: 'Neburb', repo: 'legends', per_page: 100,
              headers: {authorization: `Bearer ${process.env.PUBLIC_TOKEN}`},
            });
            const sourceLines = r => (r.body || '').replace(/\\n/g, '\n').split(/\r?\n/).filter(line => /^Source:/.test(line));
            const matches = releases.filter(r => sourceLines(r).includes(`Source: ${sourceUrl}`));
            const repair = r => new Error(`Source release needs recovery: ${r.html_url}; follow docs/release-recovery.md using this exact source SHA and existing tag.`);
            // A failed upload can leave a draft/tag. Never allocate another version for it.
            const draft = releases.find(r => r.draft);
            if (draft) throw new Error(`Source release needs recovery: ${draft.html_url}; follow docs/release-recovery.md using the draft's declared source SHA and existing tag before dispatching another source.`);
            if (matches.length > 1) throw repair(matches[0]);
            const prior = matches[0];
            if (prior) {
              if (sourceLines(prior).length !== 1) throw repair(prior);
              if (!/^v\d+\.\d+\.\d+$/.test(prior.tag_name)) throw repair(prior);
              const zipName = `stadium_realtime_combat-${prior.tag_name.slice(1)}.zip`;
              const named = name => prior.assets.filter(a => a.name === name);
              if (prior.assets.length !== 2 || named(zipName).length !== 1 || named('SHA256SUMS.txt').length !== 1) throw repair(prior);
              const zip = named(zipName)[0], sums = named('SHA256SUMS.txt')[0];
              if (!(Number.isSafeInteger(zip.size) && zip.size > 0 && zip.size <= 128 * 1024 * 1024 && Number.isSafeInteger(sums.size) && sums.size > 0 && sums.size <= 4096)) throw repair(prior);
              const download = async asset => {
                const {data} = await github.rest.repos.getReleaseAsset({
                  owner: 'Neburb', repo: 'legends', asset_id: asset.id,
                  headers: {authorization: `Bearer ${process.env.PUBLIC_TOKEN}`, accept: 'application/octet-stream'},
                });
                const bytes = Buffer.from(data);
                if (bytes.length !== asset.size) throw repair(prior);
                return bytes;
              };
              const checksum = (await download(sums)).toString('utf8').trim();
              const expected = checksum.match(/^([0-9a-f]{64}) [ *]([^\r\n]+)$/);
              if (!expected || expected[2] !== zipName) throw repair(prior);
              const zipBytes = await download(zip);
              const digest = require('node:crypto').createHash('sha256').update(zipBytes).digest('hex');
              if (digest !== expected[1]) throw repair(prior);
              try {
                require('node:child_process').execFileSync(
                  process.platform === 'win32' ? 'python' : 'python3',
                  ['scripts/isolated_release.py', '--source', 'source', '--source-sha', sha,
                   '--version', prior.tag_name.slice(1), '--verify-stdin'],
                  {input: zipBytes, stdio: ['pipe', 'pipe', 'pipe'],
                   // Only the trusted host wrapper runs here; source code runs inside its
                   // unprivileged container with no credentials, network or host processes.
                   env: Object.fromEntries(['PATH', 'SystemRoot', 'TEMP', 'TMP'].filter(
                     key => typeof process.env[key] === 'string').map(key => [key, process.env[key]]))},
                );
              } catch (error) {
                core.info(`Source package verification failed: ${error.message}`);
                throw repair(prior);
              }
              core.info(`Already published ${sha}: ${prior.html_url}`);
              core.setOutput('allowed', 'false');
              return;
            }
            // The allocator counts tags too; a tag without a release needs reconciliation.
            const tags = await github.paginate(github.rest.repos.listTags, {
              owner: 'Neburb', repo: 'legends', per_page: 100,
              headers: {authorization: `Bearer ${process.env.PUBLIC_TOKEN}`},
            });
            const orphan = tags.find(t => /^v\d+\.\d+\.\d+$/.test(t.name)
              && !releases.some(r => r.tag_name === t.name));
            if (orphan) throw new Error(`Release tag needs reconciliation: ${orphan.name} has no release; follow docs/release-recovery.md before allocating a version.`);
            // Check last, at the receiver boundary, including manual/retried dispatches.
            const {data: branch} = await github.rest.repos.getBranch({
              owner: 'Neburb', repo: 'gen1recomp-legends', branch: 'main',
            });
            if (branch.commit.sha !== sha) {
              core.info(`Skip superseded source ${sha}; main is ${branch.commit.sha}`);
              core.setOutput('allowed', 'false');
              return;
            }
            core.setOutput('allowed', 'true');

      - name: Publish GitHub Release
        if: steps.boundary.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          SOURCE_SHA: ${{ steps.version.outputs.source_sha }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --target main \
            --title "Legends $VERSION" \
            --notes "Automated package for private source commit $SOURCE_SHA.\n\nSource: https://github.com/Neburb/gen1recomp-legends/commit/$SOURCE_SHA" \
            "dist/stadium_realtime_combat-${VERSION}.zip" \
            dist/SHA256SUMS.txt
